company_name: Awesome ITSM
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome ITSM
initial_prompt: >-
  A curated directory of IT service management, IT help desk, asset/CMDB and
  service-catalog software. Include products such as ServiceNow, Jira Service
  Management, Freshservice, ManageEngine ServiceDesk Plus, SolarWinds Service
  Desk, Ivanti Neurons for ITSM, TOPdesk, HaloITSM, SysAid, GLPI, iTop, Zammad,
  plus other notable commercial and open-source options. Categories: ITSM
  Suites, IT Help Desk, Open-Source & Self-Hosted ITSM, Asset Management & CMDB,
  Service Catalogs & Portals, AIOps Add-ons. For every item capture the official
  website, a short factual description, pricing model (free, freemium, paid,
  open source), deployment (cloud or self-hosted), key features and
  integrations.


  Initial categories: ITSM Suites; IT Help Desk; Open-Source & Self-Hosted ITSM;
  Asset Management & CMDB; Service Catalogs & Portals; AIOps Add-ons.

  Target keywords: itsm software, it service management, it help desk,
  servicenow alternatives.


  Start with these source lists (use the raw README link for GitHub lists):

  - https://www.softwaresuggest.com/it-service-management-software

  -
  https://en.wikipedia.org/wiki/Comparison_of_help_desk_issue_tracking_software

  - https://en.wikipedia.org/wiki/Category:IT_service_management

  - https://awesome-selfhosted.net/tags/ticketing.html

  - https://github.com/topics/itsm


  Inclusion rules: every item is a real product, service, open-source project or
  platform in scope; never a statistic, quote, blog post, person or general
  concept.

  One item per product. The item URL is the official website (never an affiliate
  link, review-site page or "top 10" article). Skip discontinued products and
  sites that no longer resolve.

  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for
  open source state the license and link the repository.

  Each item gets exactly one primary category from the initial categories; do
  not create near-duplicate categories.

  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid,
  Enterprise, API, AI-Powered, plus niche-specific ones.

  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt,
  SourceForge/Slashdot, There's An AI For That or Toolify as sources.
website_repo: ever-works/awesome-itsm-website
